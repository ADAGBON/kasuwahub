# Render Blueprint — creates the KasuwaHub API web service.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: kasuwahub-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false            # your Atlas connection string (…mongodb.net/kasuwahub?…)
      - key: JWT_SECRET
        generateValue: true    # Render creates a long random secret for you
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false            # your Netlify URL, e.g. https://kasuwahub.netlify.app
      - key: ADMIN_EMAIL
        value: admin@kasuwahub.ng
      - key: PAYSTACK_SECRET_KEY
        sync: false            # optional: Paystack TEST secret key; leave blank for demo payments
